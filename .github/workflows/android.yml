name: Android

on:
  pull_request:
    paths: ['android/**', 'contracts/**', 'tools/verify_android.sh', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', 'contracts/**', 'tools/verify_android.sh', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      # Validates the committed wrapper JAR checksum and caches dependencies, not build outputs or secrets.
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          validate-wrappers: true
      - name: Install compile SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        with:
          cmdline-tools-version: '16111833' # 23.0; understands the android-37.0 package ID
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Domain and data JVM tests
        run: ../tools/verify_android.sh unit --max-workers=2
      - name: Compile, lint and unsigned release build
        run: ../tools/verify_android.sh build --max-workers=2
      - name: Upload JVM and lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-jvm-and-lint
          path: |
            android/**/build/test-results/**/*.xml
            android/**/build/reports/tests/**
            android/**/build/reports/lint-results-*.html
            android/**/build/reports/lint-results-*.xml
          retention-days: 14
          if-no-files-found: warn

  instrumentation:
    name: Room and Keystore (API ${{ matrix.api-level }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported API and current targetSdk. Physical S24+ acceptance is separate.
        api-level: [31, 36]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          validate-wrappers: true
      - name: Install compile SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        with:
          cmdline-tools-version: '16111833' # 23.0; understands the android-37.0 package ID
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Enable runner KVM access
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Execute Room and Keystore instrumentation
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          # Current emulator defaults to 12 GiB, exceeding hosted-runner free space after SDK installation.
          disk-size: 2048M
          disable-linux-hw-accel: false
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: ./tools/verify_android.sh connected --max-workers=2
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-instrumentation-api-${{ matrix.api-level }}
          path: |
            android/core/data/build/outputs/androidTest-results/connected/**
            android/core/data/build/reports/androidTests/connected/**
          retention-days: 14
          if-no-files-found: warn
