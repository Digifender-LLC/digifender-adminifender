name: Android

on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # Validates the committed wrapper JAR checksum and caches dependencies, not build outputs or secrets.
      - uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true
      - name: Domain and data JVM tests
        run: ./gradlew --no-daemon :core:model:test :core:data:testDebugUnitTest
      - name: Compile, lint and unsigned release build
        run: ./gradlew --no-daemon :core:data:lintDebug :core:data:assembleDebugAndroidTest :app:assembleDebug :app:lintDebug :app:assembleRelease
