name: Android

on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      # Validates the committed wrapper JAR checksum and caches dependencies, not build outputs or secrets.
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          validate-wrappers: true
      - name: Domain and data JVM tests
        run: ./gradlew --no-daemon :core:model:test :core:data:testDebugUnitTest :app:testDebugUnitTest
      # Staging APKs from CI sign in with passkeys only when signed with the owner's registered debug key
      # (ops/staging.md). AGP signs debug and staging builds with ~/.android/debug.keystore, so the secret is decoded
      # there. Without it (forks, or before the secret exists), AGP generates a throwaway key as before.
      - name: Shared staging signing key
        env:
          KEYSTORE_B64: ${{ secrets.ADMINIFENDER_STAGING_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ADMINIFENDER_STAGING_DEBUG_KEYSTORE is not set; the staging APK uses a throwaway key and cannot sign in."
            exit 0
          fi
          mkdir -p ~/.android
          printf '%s' "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
          fingerprint=$(keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | sed -n 's/^[[:space:]]*SHA256: //p')
          echo "::notice::Staging APK signing certificate SHA-256: $fingerprint"
      - name: Compile, lint and unsigned release build
        run: ./gradlew --no-daemon :core:data:lintDebug :core:data:assembleDebugAndroidTest :app:assembleDebug :app:lintDebug :app:assembleRelease :app:assembleStaging
      # Installable staging APK (signed with the shared staging debug key when the secret exists, otherwise a
      # throwaway one) and the unsigned release APK. No keys, secrets or google-services.json are in either.
      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adminifender-apks
          path: |
            android/app/build/outputs/apk/staging/app-staging.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
          if-no-files-found: error
